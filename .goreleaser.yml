version: 2

project_name: kumihan4md

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/kumi
    binary: kumi
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Revision={{.ShortCommit}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64 # Chrome に 32bit 版がないため 386 は対象外

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

release:
  prerelease: auto

# brews（Formula）は GoReleaser v2.10 で非推奨になったため homebrew_casks を使う
homebrew_casks:
  - name: kumihan4md
    binaries:
      -  kumi
    repository:
      owner: yoshihicode
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/yoshihicode/kumihan4md"
    description: "Typeset Markdown into page-break-aware PDFs (command: kumi)."
    caveats: |
      kumi requires Google Chrome (131 or later) and Japanese fonts.
      Run `kumi -check` to verify your environment.
    hooks:
      post:
        # 署名していない macOS 用バイナリが Gatekeeper にブロックされないよう、隔離属性を外す
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kumi"]
          end
